name: DB Migrate (Production)

# Drizzle 마이그레이션을 프로덕션 Supabase DB에 적용합니다.
# 사람이 로컬에서 원격 DB로 직접 migrate를 쏘지 않고, 이 워크플로우에만 권한을 줍니다.
#
# 필수 설정 (1회만 수행):
#   GitHub 저장소 → Settings → Environments → "production" 생성
#     └─ Secrets → Add secret
#         이름: PRODUCTION_DATABASE_URL
#         값 : Supabase Dashboard → Settings → Database → Connection string
#              의 "Session" 또는 "Direct connection" (port 5432) 문자열
#     ※ Transaction pooler(6543) 문자열을 넣으면 prepared statement 충돌로 실패합니다.

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "lib/db/schema.ts"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

# 최소 권한. 마이그레이션 잡은 외부 secret(DATABASE_URL)만 사용.
permissions:
  contents: read

jobs:
  migrate:
    name: drizzle-kit migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: db-migrate-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate DATABASE_URL port (must be 5432)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret 이 비어 있습니다. production environment 설정을 확인하세요."
            exit 1
          fi
          if echo "$DATABASE_URL" | grep -qE ':6543(/|$|\?)'; then
            echo "::error::Transaction pooler(6543) URL 감지 — Direct/Session pooler(5432) URL 로 교체하세요. 마이그레이션은 5432 가 필수 (CLAUDE.md §6)."
            exit 1
          fi

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx drizzle-kit migrate
