name: CI

# PR 검증 + main 브랜치 보호용 파이프라인.
# - lint-unit-build: 타입/린트/Vitest/Next 빌드
# - e2e: Playwright(chromium) 로 홈 렌더 smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 최소 권한. checkout 과 artifact 업로드만 필요.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit-build:
    name: lint + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.5"
          # rhysd/actionlint v1.7.5 actionlint_1.7.5_linux_amd64.tar.gz SHA-256.
          # 갱신 시 사람이 `gh release download <ver> -R rhysd/actionlint -p actionlint_<ver>_checksums.txt`
          # 로 직접 검증 후 박는다 (in-patch SHA → git blame 에 검증 증적).
          ACTIONLINT_SHA256: "3e6e0a832dfa0b5f027e6b8956aad2632d69b7cb778b1cff847b40279950a856"
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL --retry 3 --retry-delay 2 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz
          ./actionlint -version

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit / contract tests
        env:
          # tests/contract/actionlint-binary.test.ts 가 회귀 가드로 사용
          ACTIONLINT_BIN: /tmp/actionlint
        run: npm test

      - name: Next.js build
        run: npm run build

  e2e:
    name: playwright e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write .env.local for CI
        run: echo "DATABASE_URL=$DATABASE_URL" > .env.local

      - name: Run DB migrations
        run: npm run db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
